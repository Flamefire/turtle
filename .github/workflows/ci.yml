name: CI


permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - feature/**

concurrency:
  group: ${{format('{0}:{1}', github.repository, github.ref)}}
  cancel-in-progress: true

env:
  NET_RETRY_COUNT: 5
  DOCBOOK_XSL_DIR: /usr/share/xml/docbook/stylesheet/docbook-xsl
  DOCBOOK_DTD_DIR: /usr/share/xml/docbook/schema/dtd/4.2

jobs:
  Formatting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Formatting
      uses: DoozyX/clang-format-lint-action@bcb4eb2cb0d707ee4f3e5cc3b456eb075f12cf73 # v0.20
      with:
        clangFormatVersion: 10

  call-boost-ci:
    name: Run Build
    uses: boostorg/boost-ci/.github/workflows/reusable.yml@master
    with:
      library_folder: turtle
      b2_targets: "libs/turtle/test libs/turtle/doc//mock_examples"
      branch_coverage: false
      coverage_service: coveralls
      enable_cmake: false
      enable_32bit: false
      enable_multiarch: false
      enable_reflection: false
      exclude_compiler: gcc-4.4,gcc-4.6,gcc-4.7,gcc-4.8,gcc-4.9,gcc-5,gcc-6,clang-3.5,clang-3.6,clang-3.7,clang-3.8,clang-3.9,clang-4.0,clang-5.0,clang-6.0
      exclude_cxxstd: 98,03,0x,11

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: boostorg/boost
        ref: master
        path: boost-root
        submodules: false
    - name: Init submodules for doc build
      run: git -C boost-root submodule update --init tools/build tools/boostbook tools/quickbook tools/inspect
    - name: Bootstrap b2
      run: cd boost-root && ./bootstrap.sh
    - name: Build doc
      run: scripts/build_doc.sh
      env:
        BOOST_ROOT: ${{ github.workspace }}/boost-root
    - name: Build and run inspect
      run: cd boost-root && ./b2 "$GITHUB_WORKSPACE/test//inspect" -q

  CMake:
    defaults:
      run:
        shell: bash

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # MSVC
          - os: windows-2022
            toolset: msvc-14.44
            cxxstd: 20
            boostBranch: boost-1.58.0
            generator: 'Visual Studio 17 2022'
          - os: windows-2022
            toolset: msvc-14.44
            cxxstd: 20
            boostBranch: master
            generator: 'Visual Studio 17 2022'
          # MinGW
          - os: windows-2022
            toolset: mingw
            cxxstd: 17
            boostBranch: boost-1.86.0
            generator: 'MinGW Makefiles'
          - os: windows-2022
            toolset: mingw
            cxxstd: 17
            boostBranch: master
            generator: 'MinGW Makefiles'
          # GCC
          - os: ubuntu-22.04
            toolset: gcc
            cxxstd: 14
            boostBranch: boost-1.58.0
          - os: ubuntu-22.04
            toolset: gcc
            cxxstd: 14
            boostBranch: master
          # Clang
          - os: ubuntu-22.04
            toolset: clang
            cxxstd: 14
            boostBranch: boost-1.58.0
          - os: ubuntu-22.04
            toolset: clang
            cxxstd: 14
            boostBranch: master
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # turtle
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: boostorg/boost
          ref: ${{ matrix.boostBranch }}
          path: boost-root
          submodules: true
          persist-credentials: false
      - name: Move Boost out of workspace
        run: |
          mv boost-root ..
          echo "BOOST_ROOT=$GITHUB_WORKSPACE/../boost-root" >> $GITHUB_ENV
      - name: Setup Boost
        working-directory: ${{ env.BOOST_ROOT }}
        run: |
          ./bootstrap.sh 2>/dev/null || ./bootstrap.bat
          ./b2 headers
      - name: Build required boost libs
        working-directory: ${{ env.BOOST_ROOT }}
        run: |
          ./b2 --with-test --with-thread --with-chrono --with-system --with-atomic --with-date_time -a -j3
          # Add lib folder to LD_LIBRARY_PATH, so the tests can load them
          echo "LD_LIBRARY_PATH=$PWD/stage/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
      - name: CMake build
        run: |
          mkdir build && cd build
          extra_args=()
          if [[ -n "${{ matrix.generator }}" ]]; then
            extra_args+=(-G "${{ matrix.generator }}")
          fi
          if [[ "${{ matrix.generator }}" == "MinGW"* ]]; then
            # Avoid "Fatal error: can't write 1214 bytes to section .text of [...] 'file too big' [...] too many sections"
            extra_args+=(-DCMAKE_CXX_FLAGS="-Wa,-mbig-obj")
            # GHA has 2 MinGWs installed which must not be mixed,
            # so make sure the executables pick up the libraries/DLLs matching the compiler
            gcc_folder=$(dirname "$(which g++)")
            prefix=${gcc_folder%/bin}
            export PATH="$prefix/bin:$prefix/lib:$PATH"
          fi
          if [[ -n "${{ matrix.b2_cxxflags }}" ]]; then
            extra_args+=(-DCMAKE_CXX_FLAGS="${{ matrix.b2_cxxflags }}")
          fi
          if [[ -n "${{ matrix.cxxstd }}" ]]; then
            extra_args+=(-DCMAKE_CXX_STANDARD=${{ matrix.cxxstd }})
          fi
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DBoost_ROOT="$BOOST_ROOT/stage" "${extra_args[@]}" -DCMAKE_VERBOSE_MAKEFILE=ON -DBoost_DEBUG=ON -DBoost_VERBOSE=ON
          cmake --build . --config Debug --parallel 3
          ctest --output-on-failure --build-config Debug
